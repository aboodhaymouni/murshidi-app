<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#013070" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

         network, which is the offline case this app advertises. Arabic + Latin
         subsets only; both families are SIL OFL 1.1. -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/plex-arabic-400-arabic.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="./fonts/plex-arabic-700-arabic.woff2" crossorigin>
    <link rel="stylesheet" href="./fonts/fonts.css">

    <title>مُرشِدي — منصّة دعم قرار اختيار التخصّص</title>
  </head>
  <body>
    <!-- Plain white field so the very first paint already matches the brand
         splash; React replaces it the moment it mounts. No logo, no text. -->
    <div id="root"><div style="position:fixed;inset:0;background:#FFFFFF"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
